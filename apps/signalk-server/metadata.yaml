name: Signal K Server
app_id: signalk-server
version: 2.32.0-4
upstream_version: 2.32.0
description: Signal K server for marine data processing and routing
long_description: |
  Signal K is a modern and open data format for marine use. A Signal K server
  provides a central hub for collecting, processing, and distributing marine
  data from multiple sources including NMEA 0183, NMEA 2000, and other sensors.

  Features:
  - WebSocket API for real-time data streaming
  - Data logging and historical playback
  - Web app server for marine applications
  - Plugin system for extending functionality
  - Instrument integration and display
homepage: https://signalk.org/
maintainer: Matti Airas <matti.airas@hatlabs.fi>
license: Apache-2.0
tags:
  - role::container-app
  - field::marine
  - category::communication
  - category::monitoring
  - interface::web
  - use::routing
  - network::server
debian_section: net
architecture: all
depends:
  - docker.io (>= 20.10) | docker-ce (>= 20.10)
  - python3-bcrypt
web_ui:
  enabled: true
  path: /
  port: 3000
  protocol: http
  visible: true
layout:
  priority: 40
  width: 2
  height: 2
  x_offset: 0
  y_offset: 0
routing:
  host_port: 3000
  # Clients find the server over mDNS, and avahi publishes these records.
  # Signal K's own responder is turned off rather than left to fail: it and
  # avahi-daemon both bind UDP 5353 under host networking and both answer, so
  # leaving it on gives every type a second, collision-renamed instance.
  # "mdns": false goes into default-data for a new install, and prestart.sh
  # applies it once on every other device, recording that it did so.
  #
  # Disabling the responder drops all six record sets it publishes, so this
  # list replaces them rather than adding one. The entries without a port take
  # the Traefik TLS port, which keeps clients on TLS; _nmea-0183 is a plain TCP
  # stream the proxy does not front, so it names its own port. _signalk-tcp
  # (8375) is deliberately absent: it is Signal K over plaintext.
  #
  # Two records are not equivalent to what the server published. avahi cannot
  # supply the TXT keys, so clients lose `roles` and `self` (the vessel MRN),
  # which only the running server knows. Tracked in halos-org/halos#182.
  mdns:
    - type: _signalk-wss._tcp
    - type: _signalk-https._tcp
    - type: _https._tcp
    - type: _nmea-0183._tcp
      port: 10110
  auth:
    # Signal K authenticates users itself via Authelia OIDC (native OAuth), so
    # there is no Traefik edge gate; mode: oidc wires the Authelia client
    # scaffolding declaratively. The registered client id is "signalk" (the
    # app_id is signalk-server), and the redirect is path-based.
    mode: oidc
    oidc:
      client_id: signalk
      client_name: "Signal K Server"
      token_endpoint_auth_method: client_secret_post
      scopes: [openid, profile, email, groups]
      consent_mode: implicit
      redirect:
        style: path
        path: /signalk-server/signalk/v1/auth/oidc/callback
      env:
        SIGNALK_OIDC_CLIENT_SECRET: secret
        SIGNALK_OIDC_ISSUER: issuer
        SIGNALK_OIDC_REDIRECT_URI: redirect
default_config:
  # OIDC: the dynamic values (client secret, issuer, redirect) are supplied at
  # runtime via the generated runtime.env; only the static settings live here.
  SIGNALK_OIDC_ENABLED: "true"
  SIGNALK_OIDC_CLIENT_ID: "signalk"
  SIGNALK_OIDC_SCOPE: "openid email profile groups"
  SIGNALK_OIDC_PROVIDER_NAME: "HaLOS SSO"
  SIGNALK_OIDC_DEFAULT_PERMISSION: "readonly"
  SIGNALK_OIDC_ADMIN_GROUPS: "admins"
  SIGNALK_OIDC_READWRITE_GROUPS: "users"
  SIGNALK_OIDC_AUTO_LOGIN: "true"
