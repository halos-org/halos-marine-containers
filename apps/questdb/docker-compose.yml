services:
  questdb:
    image: questdb/questdb:10.0.0
    container_name: questdb
    init: true
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
    # Loopback only: Signal K runs with host networking and reaches these on
    # 127.0.0.1, and nothing else on the boat network should reach a database
    # that authenticates none of its three protocols. Only the HTTP port gets a
    # Traefik router, behind Authelia.
    #
    # This bounds the HOST interfaces and nothing else. The generator injects
    # halos-proxy-network (routing.py: join_proxy_network is true for every app
    # that is not host-networked), it is a plain bridge, and Docker port
    # publication does not gate container-to-container traffic -- so any app
    # container on that network reaches all three ports directly, Traefik and
    # Authelia not involved. QuestDB is the first datastore here with no
    # credential of its own to fall back on.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9009:9009"
      - "127.0.0.1:8812:8812"
    volumes:
      - ${CONTAINER_DATA_ROOT}/db:/var/lib/questdb
    environment:
      - QDB_TELEMETRY_ENABLED=false
      - QDB_HTTP_ENABLED=true
      - QDB_LINE_TCP_ENABLED=true
      # QuestDB's default commit mode, nosync, fsyncs nothing on the ingest
      # path and leaves durability to the OS page cache. A power cut can then
      # land a commit record while the partition data it describes is still
      # dirty: the table claims rows that are not on disk, and QuestDB fails
      # while OPENING that partition. No RESUME WAL variant repairs it -- both
      # remedies run after the open -- so it costs the whole table. With sync,
      # partition columns are fsynced before the commit record is written and
      # WAL segments are fsynced on commit, so the stored state can never claim
      # data it does not have. Writes are already batched by the plugin's
      # commit interval, so the cost at boat data rates is negligible.
      - QDB_CAIRO_COMMIT_MODE=sync
      # One worker per pool: this runs beside Signal K, InfluxDB, Grafana and
      # the web stack on a Pi-class board, and QuestDB sizes most pools from
      # the core count instead. Every pool that starts threads here needs its
      # own count -- QDB_SHARED_WORKER_COUNT is the one exception, since the
      # network, query and write pools each fall back to it. The ILP IO pool
      # needs one despite defaulting to 0, because a zero count there means
      # "dedicated pool sized by cores", not "use the shared pool".
      - QDB_WAL_APPLY_WORKER_COUNT=1
      - QDB_SHARED_WORKER_COUNT=1
      - QDB_LINE_TCP_WRITER_WORKER_COUNT=1
      - QDB_LINE_TCP_IO_WORKER_COUNT=1
      - QDB_VIEW_COMPILER_WORKER_COUNT=1
      - QDB_MAT_VIEW_REFRESH_WORKER_COUNT=1
      - QDB_LIVE_VIEW_REFRESH_WORKER_COUNT=1
      - QDB_CAIRO_O3_COLUMN_MEMORY_SIZE=262144
      # Every pool spins for sleep.threshold poll cycles before it sleeps, and
      # the default 10000 burns CPU whether or not rows arrive -- a fixed floor
      # rather than work. Measured on a HALPI2 at 139 rows/s, 2026-08: the
      # defaults cost 8.5% of a core against under 0.3% of ingest, and these
      # settings take it to 3.0%. Re-measure rather than trusting those figures
      # after an image repin; the tuning notes in
      # signalk-questdb-history-provider carry the method.
      #
      # The threshold is per pool and there is no global default, so a pool
      # left out keeps the full spin. That includes pools whose feature is
      # never exercised here: they poll for work that never arrives.
      - QDB_SHARED_WORKER_SLEEP_THRESHOLD=100
      - QDB_LINE_TCP_IO_WORKER_SLEEP_THRESHOLD=100
      - QDB_LINE_TCP_WRITER_WORKER_SLEEP_THRESHOLD=100
      - QDB_WAL_APPLY_WORKER_SLEEP_THRESHOLD=100
      - QDB_VIEW_COMPILER_WORKER_SLEEP_THRESHOLD=100
      - QDB_MAT_VIEW_REFRESH_WORKER_SLEEP_THRESHOLD=100
      - QDB_LIVE_VIEW_REFRESH_WORKER_SLEEP_THRESHOLD=100
      - QDB_EXPORT_WORKER_SLEEP_THRESHOLD=100
      # QuestDB narrates every WAL commit at INFO, which costs a percent of a
      # core in its logging thread and floods journald. A level here is a
      # floor, not an exact set, so ERROR still carries CRITICAL and ADVISORY:
      # table suspension, ILP parse failures and the max_map_count warning all
      # survive. What it drops is the INFO band, which includes the WAL apply
      # memory-pressure backoff that precedes a suspension -- so this is
      # settable, and INFO is the level to use when a boat reports recording
      # stalls. `SELECT name, suspended, writerTxn, sequencerTxn FROM
      # wal_tables()` answers the same question without a restart.
      - QDB_LOG_W_STDOUT_LEVEL=${QUESTDB_LOG_LEVEL:-ERROR}
    # QuestDB memory-maps every partition column file and every WAL segment, so
    # it needs far more descriptors than the stock limit grants. The container
    # inherits this from the runtime rather than from the host's fs.file-max.
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # The JVM sizes its heap from the cgroup limit, so capping here bounds the
    # total footprint including off-heap rather than just the heap.
    mem_limit: ${QUESTDB_MEMORY_LIMIT:-768m}
    cpus: 1.5
    healthcheck:
      # /ping is QuestDB's liveness endpoint and answers 204 immediately.
      # Probing / instead makes curl hang on the console's 301 until timeout.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/ping"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
