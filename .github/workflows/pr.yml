name: Pull Request Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    uses: halos-org/shared-workflows/.github/workflows/pr-checks.yml@main
    with:
      # This job is the only one that builds the packages, and the build is what
      # runs tools/verify-payloads.sh -- the guard against an app file reaching
      # no .deb. Enabled for the build, not for lintian: the lintian step globs
      # *.deb in the checkout root while build-all.sh writes to build/, so it
      # inspects nothing (halos-org/shared-workflows).
      skip-lintian: false
