name: Pull Request Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    uses: halos-org/shared-workflows/.github/workflows/pr-checks.yml@main
    with:
      # This job is the only one that builds the packages, and the build runs
      # tools/verify-payloads.sh -- the guard that catches an app file reaching
      # no .deb. Skipping it left that guard running only after merge, which is
      # how a curated plugin manifest once shipped in nothing. Lintian itself
      # still runs at release; here it costs nothing extra once the .debs exist.
      skip-lintian: false
