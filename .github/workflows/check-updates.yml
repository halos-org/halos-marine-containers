name: Check Container Image Updates

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-check-image-updates
  cancel-in-progress: true

jobs:
  check-updates:
    uses: halos-org/shared-workflows/.github/workflows/check-image-updates.yml@main
    with:
      compose-pattern: 'apps/*/docker-compose.yml'
      auto-merge: true
    secrets:
      # A fine-grained token for this repo with Contents and Pull requests
      # write. Pushed and merged with github.token, the PR would run no checks
      # and its merge would not trigger main.yml.
      token: ${{ secrets.BUMP_PAT }}
    permissions:
      contents: write
      pull-requests: write
