name: 'Run Tests'
description: 'Run all tests for halos-marine-containers'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      # bcrypt: apps/signalk-server/prestart.sh hashes the admin password
      # with it, and the package declares python3-bcrypt as a runtime
      # dependency. The harness used to stub it; the hook now imports it.
      run: pip install pytest pyyaml bcrypt

    - name: Run pytest tests
      shell: bash
      run: python -m pytest tests/ -v

    - name: Validate YAML syntax
      shell: bash
      run: python -c 'import yaml; yaml.safe_load(open("store/marine.yaml"))'
