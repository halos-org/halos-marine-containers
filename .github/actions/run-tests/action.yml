name: 'Run Tests'
description: 'Run all tests for halos-marine-containers'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      # One source for all three consumers of these: this action, ./run test,
      # and a bare local run. They drifted once already, and the CI-only copy
      # meant ./run test failed on a dependency the suite needs.
      run: pip install -r tests/requirements.txt

    - name: Run pytest tests
      shell: bash
      run: python -m pytest tests/ -v

    - name: Validate YAML syntax
      shell: bash
      run: python -c 'import yaml; yaml.safe_load(open("store/marine.yaml"))'
